<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Zuu Music</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#121212">
  <link rel="icon" type="image/png" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .logo {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      background: linear-gradient(135deg, #1ed760, #00f2fe);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      font-weight: 900;
      color: #000;
      box-shadow: 0 10px 30px rgba(30, 215, 96, 0.4);
      margin-bottom: 20px;
    }
    h1 { font-size: 24px; font-weight: 800; margin-bottom: 8px; }
    p { font-size: 14px; color: #888; margin-bottom: 24px; }
    .btn {
      background: linear-gradient(135deg, #1ed760, #00f2fe);
      color: #000;
      font-size: 15px;
      font-weight: 800;
      padding: 14px 32px;
      border-radius: 999px;
      text-decoration: none;
      display: inline-block;
      box-shadow: 0 8px 20px rgba(30, 215, 96, 0.3);
    }
  </style>
  <script>
    window.location.replace("/");
  </script>
</head>
<body>
  <div class="logo">Z</div>
  <h1>Launching Zuu Music</h1>
  <p>Connecting to 320kbps Lossless Audio Stream...</p>
  <a href="/" class="btn">Open App</a>
</body>
</html>
